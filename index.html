<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OTPAuth Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.3.1/otpauth.umd.min.js"></script>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        .progress-transition { transition: width 1s linear, background-color 0.3s ease; }
        .code-transition { transition: color 0.3s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal Overlay */
        #qr-modal { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-indigo-200">

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100 flex flex-col max-h-[90vh]">
        
        <!-- Header -->
        <div class="flex items-center gap-4 mb-6 shrink-0">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-md bg-white border border-slate-100 overflow-hidden shrink-0">
                <img src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn.net/main/image/1786624647999.png" 
                     alt="Logo" 
                     class="w-full h-full object-cover"
                     onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=2FA&background=4f46e5&color=fff&size=128';">
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-slate-800">Authenticator</h2>
                <p class="text-xs text-slate-500 font-medium">Manage your 2FA accounts</p>
            </div>
        </div>

        <!-- Add / Edit Form Section -->
        <div class="mb-6 shrink-0 bg-slate-50 p-4 rounded-2xl border border-slate-200 relative">
            <div class="flex justify-between items-center mb-3">
                <h3 id="form-title" class="text-sm font-bold text-slate-700 uppercase tracking-wider">အကောင့်အသစ်ထည့်ရန်</h3>
                <!-- QR Scan Button -->
                <button type="button" id="open-scanner-btn" class="flex items-center gap-1.5 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                    Scan QR
                </button>
            </div>

            <form id="account-form" class="space-y-3">
                <input type="hidden" id="edit-id">
                
                <!-- Account Name -->
                <div>
                    <input type="text" id="account-name" required
                        placeholder="Account Name (e.g. Facebook, Google)" 
                        class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm font-medium transition-all shadow-sm">
                </div>

                <!-- Secret Key -->
                <div class="relative flex items-center">
                    <input type="password" id="secret-key" required
                        placeholder="Secret Key (Base32)" 
                        class="w-full pl-4 pr-12 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm font-mono uppercase transition-all shadow-sm"
                        autocomplete="off" spellcheck="false">
                    
                    <!-- Toggle Visibility -->
                    <button type="button" id="toggle-visibility" class="absolute right-3 text-slate-400 hover:text-indigo-600 focus:outline-none p-1 rounded-md transition-colors" title="Show/Hide Key">
                        <svg id="eye-slash" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                
                <p id="error-msg" class="text-red-500 text-xs font-medium hidden flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    Secret Key အမှားထည့်ထားပါသည်။
                </p>

                <!-- Action Buttons -->
                <div class="flex gap-2 pt-1">
                    <button type="submit" id="save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl transition-colors text-sm shadow-md shadow-indigo-200">
                        Save Account
                    </button>
                    <button type="button" id="cancel-btn" class="hidden flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl transition-colors text-sm">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Saved Accounts List Section -->
        <div class="flex-1 overflow-y-auto custom-scroll pr-2 -mr-2 space-y-4" id="accounts-container">
            <!-- Accounts will be injected here by JavaScript -->
            <div id="empty-state" class="text-center py-8 opacity-60 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <p class="text-sm font-medium text-slate-500">မှတ်ထားသော အကောင့်မရှိသေးပါ။</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs font-medium text-slate-400 flex items-center justify-center gap-1 shrink-0">
            Made With <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-red-500 animate-pulse" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg> By: <span class="text-slate-600 font-bold">Jue Htet</span>
        </div>

    </div>

    <!-- QR Scanner Modal -->
    <div id="qr-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white p-5 rounded-2xl shadow-2xl w-full max-w-sm relative">
            <button type="button" id="close-scanner-btn" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors bg-slate-100 rounded-full p-1 z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h3 class="text-lg font-bold text-slate-800 mb-4 text-center">Scan 2FA QR Code</h3>
            
            <!-- Camera Viewport -->
            <div id="reader" class="w-full bg-black rounded-lg overflow-hidden border-2 border-dashed border-indigo-300"></div>
            
            <p class="text-xs text-slate-500 text-center mt-4">QR Code ကို ကင်မရာနှင့် ချိန်၍ ဖတ်ပါ။</p>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-[200] flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toast-msg">အောင်မြင်ပါသည်။</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // UI Elements
            const form = document.getElementById('account-form');
            const nameInput = document.getElementById('account-name');
            const secretInput = document.getElementById('secret-key');
            const editIdInput = document.getElementById('edit-id');
            const errorMsg = document.getElementById('error-msg');
            const saveBtn = document.getElementById('save-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const formTitle = document.getElementById('form-title');
            const accountsContainer = document.getElementById('accounts-container');
            const emptyState = document.getElementById('empty-state');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            const toggleVisibilityBtn = document.getElementById('toggle-visibility');
            const eyeSlashIcon = document.getElementById('eye-slash');
            const eyeOpenIcon = document.getElementById('eye-open');
            
            // QR Modal Elements
            const qrModal = document.getElementById('qr-modal');
            const openScannerBtn = document.getElementById('open-scanner-btn');
            const closeScannerBtn = document.getElementById('close-scanner-btn');
            let html5QrcodeScanner = null;

            // State Data
            let accounts = JSON.parse(localStorage.getItem('2fa_accounts_pro_v2')) || [];
            let updateInterval;

            // --- မျက်လုံးဖွင့်/ပိတ် စနစ် ---
            toggleVisibilityBtn.addEventListener('click', () => {
                if (secretInput.type === 'password') {
                    secretInput.type = 'text';
                    eyeSlashIcon.classList.add('hidden');
                    eyeOpenIcon.classList.remove('hidden');
                } else {
                    secretInput.type = 'password';
                    eyeOpenIcon.classList.add('hidden');
                    eyeSlashIcon.classList.remove('hidden');
                }
            });

            // --- Notification ---
            function showToast(message, isError = false) {
                toastMsg.textContent = message;
                toast.querySelector('svg').className = isError ? "h-4 w-4 text-red-400" : "h-4 w-4 text-emerald-400";
                toast.innerHTML = isError ? 
                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg> <span id="toast-msg">${message}</span>` : 
                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg> <span id="toast-msg">${message}</span>`;
                
                toast.classList.remove('opacity-0', 'translate-y-4');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4');
                }, 2500);
            }

            // --- QR Scanner စနစ် ---
            openScannerBtn.addEventListener('click', () => {
                qrModal.classList.remove('hidden');
                
                // Initialize Scanner
                html5QrcodeScanner = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess,
                    (errorMessage) => {
                        // ignore background scan errors
                    }
                ).catch(err => {
                    showToast("ကင်မရာအသုံးပြုခွင့် မရှိပါ။", true);
                    closeQRModal();
                });
            });

            closeScannerBtn.addEventListener('click', closeQRModal);

            function closeQRModal() {
                qrModal.classList.add('hidden');
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        html5QrcodeScanner.clear();
                    }).catch(err => console.log(err));
                }
            }

            function onScanSuccess(decodedText) {
                closeQRModal(); // အောင်မြင်ရင် Modal အရင်ပိတ်မည်
                
                try {
                    // otpauth://totp/Issuer:Account?secret=XXX format ကို Library သုံးပြီးခွဲထုတ်မည်
                    let parsedURI = OTPAuth.URI.parse(decodedText);
                    
                    // Input တွေထဲကို အလိုအလျောက် ထည့်ပေးမည်
                    secretInput.value = parsedURI.secret.base32;
                    
                    // Issuer (ဥပမာ Google) နဲ့ Label (အကောင့်နာမည်) တွဲပြီးပေးမည်
                    let accountName = parsedURI.label;
                    if(parsedURI.issuer && !accountName.includes(parsedURI.issuer)) {
                        accountName = `${parsedURI.issuer} (${accountName})`;
                    }
                    nameInput.value = accountName || "Scanned Account";
                    
                    showToast("QR Code မှတ်သားပြီးပါပြီ!");
                    
                    // ချက်ချင်း Save လိုက်အောင် Save Button ဆီ Focus ပြောင်းပေးမည်
                    saveBtn.focus();
                    errorMsg.classList.add('hidden');
                    
                } catch (e) {
                    showToast("မှားယွင်းသော QR Code ဖြစ်ပါသည်။", true);
                }
            }

            // --- Form Submit (Save / Update) ---
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                errorMsg.classList.add('hidden');
                
                const name = nameInput.value.trim();
                const secret = secretInput.value.replace(/\s+/g, '').toUpperCase();
                const editId = editIdInput.value;

                try {
                    new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(secret) }).generate();
                } catch (err) {
                    errorMsg.classList.remove('hidden');
                    return;
                }

                if (editId) {
                    accounts = accounts.map(acc => acc.id === editId ? { ...acc, name, secret } : acc);
                    showToast('အကောင့်ကို ပြင်ဆင်ပြီးပါပြီ!');
                } else {
                    accounts.push({ id: Date.now().toString(), name, secret });
                    showToast('အကောင့်သစ် ထည့်သွင်းပြီးပါပြီ!');
                }

                saveAndRender();
                resetForm();
            });

            window.editAccount = (id) => {
                const account = accounts.find(acc => acc.id === id);
                if (account) {
                    nameInput.value = account.name;
                    secretInput.value = account.secret;
                    editIdInput.value = account.id;
                    formTitle.textContent = 'အကောင့် ပြင်ဆင်ရန်';
                    saveBtn.textContent = 'Update Account';
                    cancelBtn.classList.remove('hidden');
                    nameInput.focus();
                }
            };

            cancelBtn.addEventListener('click', resetForm);

            function resetForm() {
                form.reset();
                editIdInput.value = '';
                formTitle.textContent = 'အကောင့်အသစ်ထည့်ရန်';
                saveBtn.textContent = 'Save Account';
                cancelBtn.classList.add('hidden');
                errorMsg.classList.add('hidden');
                secretInput.type = 'password';
                eyeOpenIcon.classList.add('hidden');
                eyeSlashIcon.classList.remove('hidden');
            }

            window.deleteAccount = (id) => {
                if (confirm('ဤအကောင့်ကို ဖျက်ရန် သေချာပါသလား?')) {
                    accounts = accounts.filter(acc => acc.id !== id);
                    if(editIdInput.value === id) resetForm();
                    saveAndRender();
                    showToast('ဖျက်သိမ်းပြီးပါပြီ');
                }
            };

            window.copyCode = (btn, code) => {
                const el = document.createElement('textarea');
                el.value = code.replace(/\s+/g, '');
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                showToast('Code ကူးယူပြီးပါပြီ!');
                
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
                btn.classList.add('text-emerald-500', 'border-emerald-200');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('text-emerald-500', 'border-emerald-200');
                }, 1500);
            };

            function saveAndRender() {
                localStorage.setItem('2fa_accounts_pro_v2', JSON.stringify(accounts));
                renderAccountsList();
            }

            // --- UI တွင် Account များ ဖော်ပြခြင်း ---
            function renderAccountsList() {
                const cards = accountsContainer.querySelectorAll('.account-card');
                cards.forEach(card => card.remove());

                if (accounts.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    
                    accounts.forEach(acc => {
                        const card = document.createElement('div');
                        card.className = "account-card fade-in bg-white border border-slate-200 rounded-2xl p-4 md:p-5 relative overflow-hidden group shadow-sm hover:shadow-md transition-shadow";
                        card.setAttribute('data-secret', acc.secret);
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="text-sm font-bold text-slate-800 truncate pr-4">${acc.name}</h4>
                                <div class="flex gap-2 shrink-0">
                                    <button onclick="editAccount('${acc.id}')" class="text-slate-400 hover:text-indigo-600 transition-colors p-1.5 bg-slate-50 hover:bg-indigo-50 rounded-md border border-slate-100" title="Edit">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                    </button>
                                    <button onclick="deleteAccount('${acc.id}')" class="text-slate-400 hover:text-red-500 transition-colors p-1.5 bg-slate-50 hover:bg-red-50 rounded-md border border-slate-100" title="Delete">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-end mb-3">
                                <div class="code-text text-3xl md:text-4xl font-black text-indigo-600 tracking-[0.15em] code-transition cursor-pointer" title="Click to copy">
                                    ------
                                </div>
                                <button class="copy-action-btn text-slate-400 hover:text-indigo-600 bg-slate-50 p-2.5 rounded-xl border border-slate-200 transition-colors shadow-sm focus:outline-none mb-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                </button>
                            </div>
                            
                            <!-- Timer & Progress Bar (စက္ကန့်ပြသမှု ထည့်သွင်းထားသည်) -->
                            <div class="flex items-center gap-3">
                                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden flex-1">
                                    <div class="progress-bar bg-indigo-500 h-full rounded-full progress-transition" style="width: 100%;"></div>
                                </div>
                                <span class="time-left text-xs font-bold text-slate-500 w-6 text-right shrink-0">30s</span>
                            </div>
                        `;
                        accountsContainer.insertBefore(card, emptyState);

                        const copyBtn = card.querySelector('.copy-action-btn');
                        const codeDisplay = card.querySelector('.code-text');
                        
                        // Icon ကိုနှိပ်ရင် Copy
                        copyBtn.addEventListener('click', () => window.copyCode(copyBtn, codeDisplay.textContent));
                        
                        // စာလုံးအကြီးကြီးကို နှိပ်ရင်လည်း Copy
                        codeDisplay.addEventListener('click', () => window.copyCode(copyBtn, codeDisplay.textContent));
                    });
                }
                
                updateAllCodes();
            }

            // --- Timer နှင့် Code များ (စက္ကန့်အပါအဝင်) အလုပ်လုပ်စေခြင်း ---
            function updateAllCodes() {
                const cards = document.querySelectorAll('.account-card');
                if (cards.length === 0) return;

                let MathFloor = Math.floor(Date.now() / 1000);
                let remaining = 30 - (MathFloor % 30);
                let percent = (remaining / 30) * 100;

                cards.forEach(card => {
                    const secret = card.getAttribute('data-secret');
                    const codeDisplay = card.querySelector('.code-text');
                    const progressBar = card.querySelector('.progress-bar');
                    const timeLeft = card.querySelector('.time-left');

                    try {
                        let totp = new OTPAuth.TOTP({
                            issuer: 'Auth',
                            label: 'User',
                            algorithm: 'SHA1',
                            digits: 6,
                            period: 30,
                            secret: OTPAuth.Secret.fromBase32(secret)
                        });

                        let token = totp.generate();
                        codeDisplay.textContent = token.slice(0, 3) + ' ' + token.slice(3);
                        
                        // Update Seconds Text
                        timeLeft.textContent = remaining + 's';

                        // Progress Bar Update
                        if (remaining === 30) {
                            progressBar.style.transition = 'none';
                            progressBar.style.width = '100%';
                            setTimeout(() => {
                                progressBar.style.transition = 'width 1s linear, background-color 0.3s ease';
                            }, 50);
                        } else {
                            progressBar.style.width = percent + '%';
                        }

                        // Colors changing based on time (5s left -> Red)
                        if (remaining <= 5) {
                            codeDisplay.classList.remove('text-indigo-600');
                            codeDisplay.classList.add('text-red-500');
                            progressBar.classList.remove('bg-indigo-500');
                            progressBar.classList.add('bg-red-500');
                            timeLeft.classList.remove('text-slate-500');
                            timeLeft.classList.add('text-red-500');
                        } else {
                            codeDisplay.classList.add('text-indigo-600');
                            codeDisplay.classList.remove('text-red-500');
                            progressBar.classList.add('bg-indigo-500');
                            progressBar.classList.remove('bg-red-500');
                            timeLeft.classList.add('text-slate-500');
                            timeLeft.classList.remove('text-red-500');
                        }
                    } catch (err) {
                        codeDisplay.textContent = 'ERROR';
                    }
                });
            }

            renderAccountsList();
            if(updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(updateAllCodes, 1000);
        });
    </script>
</body>
</html>
